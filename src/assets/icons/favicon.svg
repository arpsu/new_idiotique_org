<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="idiotique.org">
  <rect width="64" height="64" fill="#000000"/>
  <!-- Lowercase "i". The dot sits slightly right of the stem — a fixed trace
       of the wordmark's glitch. The pair spans x=25..41, so the whole mark
       is optically centred rather than just the stem. -->
  <rect x="25" y="29" width="13" height="23" fill="#f5f5f5"/>
  <rect x="28" y="12" width="13" height="13" fill="#00e5ff"/>
</svg>
