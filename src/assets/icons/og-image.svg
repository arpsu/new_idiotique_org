<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>idiotique.org</title>
  <rect width="1200" height="630" fill="#000000"/>
  <!-- The font is injected at build time (scripts/build.mjs) so this file
       stays small and readable in the repo. Falls back to a system grotesk
       if the build is skipped. -->
  <text x="600" y="315"
        text-anchor="middle" dominant-baseline="central"
        font-family="Space Grotesk, Helvetica Neue, Arial, sans-serif"
        font-size="110" font-weight="500" letter-spacing="-1.1"
        fill="#f5f5f5">idiotique<tspan fill="#00e5ff">.</tspan>org</text>
  <rect x="540" y="404" width="120" height="3" fill="#ff2b4e" opacity="0.85"/>
</svg>
