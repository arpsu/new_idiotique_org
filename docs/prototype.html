<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>idiotique.org</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000000;
    --fg:#f5f5f5;
    --dim:#6b6b6b;
    --glitch-1:#00e5ff;
    --glitch-2:#ff2b4e;
  }

  *{ box-sizing:border-box; }

  html,body{
    height:100%;
    margin:0;
    background:var(--bg);
    overflow:hidden;
  }

  body{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:clamp(2rem, 6vh, 3.5rem);
    font-family: 'Space Grotesk', ui-sans-serif, system-ui, sans-serif;
  }

  .wordmark{
    position:relative;
    font-size: clamp(2.1rem, 8vw, 5.2rem);
    font-weight:500;
    letter-spacing:-0.01em;
    color:var(--fg);
    display:flex;
    user-select:none;
    -webkit-user-select:none;
  }

  .wordmark .char{
    position:relative;
    display:inline-block;
    opacity:0;
    transform:translateY(2px);
    animation: decode 1.8s steps(1,end) forwards;
  }

  /* staggered decode-in, index set inline via --i */
  .wordmark .char{ animation-delay: calc(var(--i) * 80ms); }

  @keyframes decode{
    0%   { opacity:0; }
    8%   { opacity:1; }
    100% { opacity:1; }
  }

  /* ambient flicker pass, starts after decode finishes */
  .wordmark.settled .char{
    animation: none;
    opacity:1;
  }

  .wordmark.settled .char.g-slice{
    animation: g-slice 400ms steps(1,end) 1;
  }

  @keyframes g-slice{
    0%   { clip-path: inset(0 0 0 0); transform:none; }
    18%  { clip-path: inset(0 45% 0 0); transform:translateX(-3px); }
    36%  { clip-path: inset(0 0 0 45%); transform:translateX(3px); }
    54%  { clip-path: inset(35% 0 40% 0); transform:translateX(-2px); }
    72%  { clip-path: inset(0 0 0 0); transform:translateX(1px); }
    100% { clip-path: inset(0 0 0 0); transform:none; }
  }

  .wordmark.settled .char.g-jitter{
    animation: g-jitter 400ms linear 1;
  }

  @keyframes g-jitter{
    0%   { transform:none; }
    14%  { transform:translate(-2px,1px); }
    28%  { transform:translate(2px,-1px); }
    42%  { transform:translate(-1px,-2px); }
    57%  { transform:translate(1px,2px); }
    71%  { transform:translate(-2px,0); }
    85%  { transform:translate(1px,-1px); }
    100% { transform:none; }
  }

  .wordmark.settled .char.g-invert{
    animation: g-invert 400ms steps(2,end) 1;
  }

  @keyframes g-invert{
    0%   { filter:none; opacity:1; }
    30%  { filter:invert(1); opacity:1; }
    55%  { filter:none; opacity:0.35; }
    78%  { filter:invert(1); opacity:1; }
    100% { filter:none; opacity:1; }
  }

  .wordmark.settled .char.g-scramble{
    animation: g-scramble 400ms steps(2,end) 1;
  }

  @keyframes g-scramble{
    0%   { opacity:1; color:var(--fg); }
    30%  { opacity:1; color:var(--glitch-1); }
    60%  { opacity:0.5; color:var(--glitch-2); }
    100% { opacity:1; color:var(--fg); }
  }

  .links{
    display:flex;
    align-items:center;
    gap:2rem;
    opacity:0;
    animation: fadeUp 0.8s ease-out 2.3s forwards;
  }

  @keyframes fadeUp{
    from{ opacity:0; transform:translateY(6px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .links a{
    color:var(--dim);
    display:inline-flex;
    transition: color 220ms ease, transform 220ms ease;
  }

  .links a svg{
    width:22px;
    height:22px;
    display:block;
  }

  .links a:hover,
  .links a:focus-visible{
    color:var(--fg);
    transform:translateY(-2px);
  }

  .links a:focus-visible{
    outline:none;
  }

  @media (prefers-reduced-motion: reduce){
    .wordmark .char{ animation:none; opacity:1; }
    .wordmark.settled .char.g-slice,
    .wordmark.settled .char.g-jitter,
    .wordmark.settled .char.g-invert,
    .wordmark.settled .char.g-scramble{ animation:none; }
    .links{ animation:none; opacity:1; }
  }
</style>
</head>
<body>

  <div class="wordmark" id="wordmark" aria-label="idiotique.org"></div>

  <nav class="links" aria-label="Social links">
    <a href="https://www.linkedin.com/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.03-1.85-3.03-1.86 0-2.14 1.45-2.14 2.94v5.66H9.34V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.38-1.85 3.61 0 4.28 2.38 4.28 5.48v6.26zM5.34 7.43c-1.14 0-2.07-.93-2.07-2.08 0-1.14.93-2.07 2.07-2.07 1.15 0 2.08.93 2.08 2.07 0 1.15-.93 2.08-2.08 2.08zM7.12 20.45H3.56V9h3.56v11.45z"/>
      </svg>
    </a>
    <a href="https://bsky.app/" target="_blank" rel="noopener noreferrer" aria-label="Bluesky">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12 10.8C10.83 8.3 7.7 3.6 4.8 1.6 2.9.4 2.1.7 1.6 1c-.6.4-.7 1.6-.7 2.3 0 .7.4 6.3.7 7.2.9 3.1 4 4.2 6.9 3.8.2 0 .3.1.1.1-3.6.5-6.8 1.9-2.6 6.6 4.6 4.9 6.3-1 7-3.2.7 2.2 2 7.8 7 3.2 4-3.9 1-5.4-2.6-6.6-.2 0-.1-.1.1-.1 2.9.4 6-.7 6.9-3.8.3-.9.7-6.5.7-7.2 0-.7-.1-1.9-.7-2.3-.5-.3-1.3-.6-3.2.6-2.9 2-6.1 6.7-7.2 9.2z"/>
      </svg>
    </a>
  </nav>

<script>
  const text = "idiotique.org";
  const el = document.getElementById('wordmark');

  text.split('').forEach((ch, i) => {
    const span = document.createElement('span');
    span.className = 'char';
    span.style.setProperty('--i', i);
    span.textContent = ch === ' ' ? '\u00A0' : ch;
    el.appendChild(span);
  });

  const chars = Array.from(el.querySelectorAll('.char'));
  const variants = ['g-slice', 'g-jitter', 'g-invert', 'g-scramble'];
  const scrambleGlyphs = '#%&+=*?/\\<>01'.split('');

  // once decode-in is done, settle and start ambient flicker
  setTimeout(() => {
    el.classList.add('settled');
    ambientFlicker();
  }, 1800 + text.length * 80 + 150);

  function triggerGlitch(c){
    const variant = variants[Math.floor(Math.random() * variants.length)];
    c.classList.remove(...variants);
    void c.offsetWidth; // restart animation
    c.classList.add(variant);

    if (variant === 'g-scramble'){
      const original = c.textContent;
      const glyph = scrambleGlyphs[Math.floor(Math.random() * scrambleGlyphs.length)];
      c.textContent = glyph;
      setTimeout(() => { c.textContent = original; }, 160);
    }
  }

  function ambientFlicker(){
    scheduleNext();
    function scheduleNext(){
      const delay = 2500 + Math.random() * 5000;
      setTimeout(() => {
        const n = Math.random() < 0.35 ? 2 : 1;
        const pool = chars.filter(c => c.textContent.trim().length > 0);
        for(let k=0; k<n; k++){
          const c = pool[Math.floor(Math.random() * pool.length)];
          triggerGlitch(c);
        }
        scheduleNext();
      }, delay);
    }
  }
</script>
</body>
</html>
